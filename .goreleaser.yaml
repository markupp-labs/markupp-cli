# Builds the static mu binary for every supported platform on a v* tag.
# Local dry run: goreleaser release --snapshot --clean
version: 2

project_name: mu

before:
  hooks:
    - go mod verify

builds:
  - id: mu
    main: ./cmd/mu
    binary: mu
    env:
      - CGO_ENABLED=0
    flags:
      - -trimpath
    ldflags:
      - -s -w -X main.version={{ .Version }}
    mod_timestamp: '{{ .CommitTimestamp }}'
    goos: [linux, darwin, windows]
    goarch: [amd64, arm64]

archives:
  - id: mu
    formats: [tar.gz]
    name_template: '{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}'
    format_overrides:
      - goos: windows
        formats: [zip]
    files:
      - LICENSE
      - README.md

checksum:
  name_template: checksums.txt

changelog:
  sort: asc
  filters:
    exclude:
      - '^test:'
      - '^docs:'
      - '^chore:'
      - '^merge:'
