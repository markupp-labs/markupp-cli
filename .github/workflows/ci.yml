name: CI

on:
  push:
    branches: [main, dev]
  pull_request:

permissions:
  contents: read

jobs:
  go:
    name: Go (format, vet, lint, tests)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Download modules
        run: go mod download

      - name: Check formatting (gofmt)
        run: |
          unformatted="$(gofmt -l .)"
          if [ -n "$unformatted" ]; then
            printf 'files not gofmt formatted:\n%s\n' "$unformatted" >&2
            exit 1
          fi

      - name: Run go vet
        run: go vet ./...

      - name: Run golangci-lint
        run: go run github.com/golangci/golangci-lint/v2/cmd/golangci-lint@v2.12.2 run

      - name: Run tests with the race detector
        run: go test ./... -race -count=1 -coverprofile=cover.out -covermode=atomic

      - name: Print coverage per function
        run: go tool cover -func=cover.out

      - name: Build the static binary
        run: CGO_ENABLED=0 go build -trimpath -o /dev/null ./cmd/mu

  vulnerabilities:
    name: Known vulnerabilities (govulncheck)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Run govulncheck
        run: go run golang.org/x/vuln/cmd/govulncheck@v1.1.4 ./...

  commit-messages:
    name: Commit conventions
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Test the support scripts
        run: make test-scripts

      - name: Validate the messages of the pull request commits
        if: github.event_name == 'pull_request'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          rejected=0
          for commit in $(git rev-list "$BASE_SHA..$HEAD_SHA"); do
            if ! git log -1 --format=%B "$commit" | ./scripts/valida-mensagem-de-commit.sh -; then
              git log -1 --format='  in commit %h %s' "$commit" >&2
              rejected=$((rejected + 1))
            fi
          done
          if [ "$rejected" -ne 0 ]; then
            printf '%s commit message(s) outside the convention\n' "$rejected" >&2
            exit 1
          fi
