name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: read

jobs:
  goreleaser:
    name: Build and publish the mu binaries
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Check that the tag follows semantic versioning
        env:
          TAG: ${{ github.ref_name }}
        run: |
          if printf '%s\n' "$TAG" | grep -qE '^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.]+)?$'; then
            exit 0
          fi
          printf 'tag %s is not vMAJOR.MINOR.PATCH with an optional prerelease, for example v1.0.0 or v1.0.0-rc.1\n' "$TAG" >&2
          exit 1

      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Run tests before publishing
        run: go test ./... -count=1

      - name: Run GoReleaser
        uses: goreleaser/goreleaser-action@v6
        with:
          distribution: goreleaser
          version: '~> v2'
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
