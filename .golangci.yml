version: "2"

run:
  tests: true

linters:
  default: standard
  enable:
    - bodyclose
    - errorlint
    - gocritic
    - gosec
    - nilerr
    - nolintlint
    - revive
  settings:
    nolintlint:
      require-explanation: true
      require-specific: true
    revive:
      rules:
        - name: exported
          disabled: true
        - name: package-comments
          disabled: true
  exclusions:
    rules:
      # Test files build fixtures from literal paths and temporary directories.
      - path: _test\.go
        linters:
          - gosec

formatters:
  enable:
    - gofmt
